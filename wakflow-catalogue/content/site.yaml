cover:
  title: One system for every message, every lead and every follow-up.
  sub: WhatsApp, team inbox, CRM, AI agents and automation — working as one system instead of a pile of apps that don't talk to each other. Built for Indian businesses.

intro:
  lead: Wakflow connects your WhatsApp number, your team's shared inbox, your CRM, your AI assistant and the automation that ties them together — so a new enquiry is answered in seconds, saved with its source, and followed up without anyone copying it between apps by hand.
  pains:
    - {t: "Your tools don't talk to each other.", d: "A WhatsApp lead is typed into a sheet by hand, and the follow-up depends on someone remembering."}
    - {t: "Enquiries get answered late, or not at all.", d: "Nobody can watch WhatsApp, Instagram, a website form and a phone line at the same time."}
    - {t: "Every extra app is another login and another bill.", d: "Small teams end up managing software instead of running their business."}
    - {t: "When something breaks, nobody notices.", d: "A disconnected number or a stuck automation stays hidden until a customer complains."}
  steps:
    - {t: A customer gets in touch, d: "WhatsApp, Instagram DM or comment, website form, chat or email."}
    - {t: An AI answers first, d: "24x7, from your own prices and policies, in the customer's language. Hot leads get a call back within a minute."}
    - {t: The lead is saved, d: "In your CRM with its source and interest, plus a follow-up task for your team."}
    - {t: A human takes over, d: "The full conversation sits in the shared inbox; the right person picks it up and the AI steps aside."}
    - {t: Follow-ups run by themselves, d: "Confirmations, payment reminders, offers and feedback requests — no one pressing send."}
    - {t: You stay in control, d: "One short morning report from your AI assistant, and nightly backups of everything."}
  proof_title: We run our own businesses on Wakflow.
  proof_sub: Ghoomo Saste Me and Tripwaley — our own travel brands — run on the same products we sell. As of 27 Sep 2026.
  stats:
    - {n: "91,907", l: "WhatsApp messages held across our brands' numbers"}
